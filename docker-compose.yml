name: ai-token-manager

services:
  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_healthy
      proxy:
        condition: service_healthy
    restart: unless-stopped

  # ===== API 代理网关 =====
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "127.0.0.1:${PROXY_PORT:-3001}:3001"
    environment:
      - PROXY_PORT=3001
      # ENV-02: JWT_SECRET 不提供默认值，强制用户在 .env 中设置
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WEB_URL=${WEB_URL:-http://web:3000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - USAGE_QUEUE_FILE=/proxy-data/usage-queue.jsonl
      # 敏感字段加密密钥（可选，未配置则明文存储）
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    volumes:
      # ENV-01: 两个服务共享同一个数据库文件，必须用同一个 volume
      - proxy-data:/proxy-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== 管理后台 =====
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=/data/data.db
      - FEISHU_APP_ID=${FEISHU_APP_ID:?FEISHU_APP_ID is required}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:?FEISHU_APP_SECRET is required}
      - FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI:?FEISHU_REDIRECT_URI is required}
      - NEXT_PUBLIC_FEISHU_APP_ID=${FEISHU_APP_ID:?FEISHU_APP_ID is required}
      - NEXT_PUBLIC_FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI:?FEISHU_REDIRECT_URI is required}
      - PUBLIC_PROXY_BASE_URL=${PUBLIC_PROXY_BASE_URL:-}
      # ENV-02: JWT_SECRET 不提供默认值，强制用户在 .env 中设置
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - ADMIN_IDS=${ADMIN_IDS:?ADMIN_IDS is required}
      # Web → Proxy 内部通信地址（Docker 网络用服务名）
      - PROXY_BASE_URL=http://proxy:3001
      - PROXY_INTERNAL_URL=http://proxy:3001
      # 敏感字段加密密钥（可选）
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - AUTO_SYNC_ENABLED=${AUTO_SYNC_ENABLED:-true}
      - AUTO_SYNC_ON_STARTUP=${AUTO_SYNC_ON_STARTUP:-true}
      - AUTO_SYNC_STARTUP_DELAY_MS=${AUTO_SYNC_STARTUP_DELAY_MS:-120000}
      - BALANCE_SYNC_INTERVAL_MINUTES=${BALANCE_SYNC_INTERVAL_MINUTES:-60}
      - BALANCE_ALERT_TIMES=${BALANCE_ALERT_TIMES:-09:30,12:00,14:30,17:30}
      - BALANCE_ALERT_NOTIFY_ENABLED=${BALANCE_ALERT_NOTIFY_ENABLED:-true}
    volumes:
      # ENV-01: 与 proxy 共享同一个 volume，确保读写同一个 data.db
      - app-data:/data
    # ENV-03: 添加 healthcheck
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  app-data:
  proxy-data:
